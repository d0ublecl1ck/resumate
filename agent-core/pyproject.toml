[project]
name = "resumate-agent-core"
version = "0.1.0"
description = "Public-API-only agent foundation for Resumate (Agent operation layer)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Resumate" }]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.6,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
resumate-agent = "resumate_agent_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resumate_agent_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
