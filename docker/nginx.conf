# 静态托管 ui/dist，并把 /api 反代到 backend。
# 与 ui/vite.config.ts 的开发代理保持同一语义：/api/* -> backend:8000/*。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # SPA 路由：真实文件优先，其余交给 index.html（react-router 的 history 模式）。
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        # Host 必须是容器内可解析的 backend:8000：Agent runner 用 request.base_url
        # 作为 CLI 的回调地址（backend/app/modules/agent/runner.py），改成外部
        # localhost:8080 会让容器内的 CLI 连不上后端。
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        # Agent 轮次事件是 SSE，必须关掉缓冲并放宽读超时。
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
