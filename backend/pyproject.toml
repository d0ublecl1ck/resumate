[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2,<3",
    "uvicorn>=0.30,<1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "redis>=5,<7",
    "argon2-cffi>=23,<26",
    "email-validator>=2,<3",
]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "fakeredis>=2.20,<3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
